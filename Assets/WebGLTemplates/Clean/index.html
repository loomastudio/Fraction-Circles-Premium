<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c5a1f; }
      body { font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #1c5a1f; }

      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 45%, #2f8a33 0%, #1c5a1f 55%, #123d14 100%);
        color: #fff; transition: opacity .6s ease; z-index: 10;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      .wheel {
        width: 150px; height: 150px; border-radius: 50%; position: relative;
        background: conic-gradient(#e64d4d 0 45deg, #fa9438 0 90deg, #f7c738 0 135deg, #73bf59 0 180deg,
                                   #38ada8 0 225deg, #4d8ce6 0 270deg, #7869db 0 315deg, #b86bd1 0 360deg);
        box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 4px rgba(30,10,10,.8);
        animation: spin 3s linear infinite;
      }
      .wheel::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: repeating-conic-gradient(rgba(30,10,10,.85) 0 1deg, transparent 1deg 45deg);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 54px); letter-spacing: 1px; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
      .sub { margin-top: -18px; opacity: .8; letter-spacing: 6px; font-size: 14px; }
      .bar { width: min(360px, 70vw); height: 14px; border-radius: 7px; background: rgba(0,0,0,.3); overflow: hidden; }
      .bar > div { height: 100%; width: 0%; border-radius: 7px; background: linear-gradient(90deg, #ffd34d, #ff9a3c); transition: width .2s ease; }
      #error { display: none; max-width: 80vw; text-align: center; background: rgba(0,0,0,.35); padding: 14px 18px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loader">
      <div class="wheel"></div>
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <div class="bar"><div id="progress"></div></div>
      <div id="error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.getElementById("game");
      var loader = document.getElementById("loader");
      var progress = document.getElementById("progress");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function () {},
      }, function (p) {
        progress.style.width = Math.round(p * 100) + "%";
      }).then(function () {
        progress.style.width = "100%";
        loader.classList.add("done");
        setTimeout(function () { loader.remove(); }, 700);
        canvas.focus();
      }).catch(function (message) {
        var e = document.getElementById("error");
        e.style.display = "block";
        var fr = (navigator.language || "").toLowerCase().indexOf("fr") === 0;
        e.textContent = (fr ? "Désolé, ce navigateur ne peut pas lancer l'outil. " : "Sorry, this browser could not start the tool. ") + message;
      });
    </script>
  </body>
</html>
